spring.application.name=mueblerix

spring.datasource.url=jdbc:mysql://localhost:3306/mueblerix?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=mueblerix
spring.datasource.password=mueblerix123


spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.ec.edu.espe.mueblerix=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.root=INFO


spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
jwt.secret=MY_SUPER_SECRET_KEY_1234567890_ABCDEFGH
jwt.access-token.expiration=3600000
jwt.refresh-token.expiration=604800000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false